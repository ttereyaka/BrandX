<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRAND X — Admin</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="login-screen" class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-circle"><span class="logo-letter">X</span></div>
        <h1>BRAND X</h1>
        <p class="login-subtitle">Admin Panel</p>
      </div>
      <button class="login-btn" onclick="checkAccess()">🔒 Войти</button>
      <div class="login-error" id="login-error"></div>
    </div>
  </div>

  <div id="admin-panel" class="admin-container" style="display:none">
    <header class="admin-header">
      <div class="admin-logo">
        <div class="logo-circle small"><span class="logo-letter">X</span></div>
        <h2>BRAND X Admin</h2>
      </div>
      <div class="admin-user-info"><span id="admin-username"></span></div>
    </header>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Всего заказов</div></div>
      <div class="stat-card pending"><div class="stat-value" id="stat-pending">0</div><div class="stat-label">Новые</div></div>
      <div class="stat-card paid"><div class="stat-value" id="stat-paid">0</div><div class="stat-label">Оплачено</div></div>
      <div class="stat-card revenue"><div class="stat-value" id="stat-revenue">0 ₽</div><div class="stat-label">Выручка</div></div>
    </div>

    <div class="admin-tabs">
      <button class="tab-btn active" data-tab="orders">📦 Заказы</button>
      <button class="tab-btn" data-tab="returns">↩️ Возвраты</button>
    </div>

    <div id="tab-orders" class="tab-content active"><div class="orders-list" id="admin-orders-list"></div></div>
    <div id="tab-returns" class="tab-content"><div class="orders-list" id="admin-returns-list"></div></div>
  </div>

  <script src="/admin.js"></script>
</body>
</html>
